<!DOCTYPE html>
<html>
<head>
<title>Hidden Fields</title>
</head>

<body>

<h2>Session Form</h2>

<form>

    <label>Username:</label>
    <input type="text" name="username">

    <input type="hidden" name="session_id" value="12345">
    <input type="hidden" name="user_type" value="student">

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
