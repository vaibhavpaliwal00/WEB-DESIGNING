<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Table</title>

    <style>
        body {
            font-family: Arial;
        }

        .container {
            width: 700px;
            margin: 50px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid gray;
            text-align: center;
        }

        th {
            background-color: blue;
            color: white;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

        tr:hover {
            background-color: lightblue;
        }

        input {
            padding: 7px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Data Entry</h2>

    <form>

        <table>

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="email"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="email"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="email"></td>
                <td><input type="text"></td>
            </tr>

        </table>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
