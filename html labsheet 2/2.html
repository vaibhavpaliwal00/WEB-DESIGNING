<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registr\ation Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text"
               name="name"
               required
               minlength="3"
               maxlength="30"
               pattern="[A-Za-z ]+">
        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               required>
        <br><br>

        <label>Password:</label>
        <input type="password"
               name="password"
               required
               minlength="8"
               maxlength="20">
        <br><br>

        <label>Phone Number:</label>
        <input type="text"
               name="phone"
               required
               pattern="[0-9]{10}"
               maxlength="10">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Course:</label>
        <select required>
            <option value="">Select Course</option>
            <option>MCA</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>BBA</option>
        </select>
        <br><br>

        <label>Address:</label><br>
        <textarea name="address"
                  required
                  minlength="10"
                  maxlength="100"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
