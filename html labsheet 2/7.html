<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            width: 400px;
            margin: 50px auto;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 2px solid gray;
        }

        input:focus,
        textarea:focus {
            border-color: blue;
            background-color: lightblue;
            outline: none;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Feedback Form</h2>

    <input type="text" placeholder="Your Name">

    <input type="email" placeholder="Your Email">

    <textarea rows="5" placeholder="Your Feedback"></textarea>

    <button>Submit</button>

</div>

</body>
</html>
