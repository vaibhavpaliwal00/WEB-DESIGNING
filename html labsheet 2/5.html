<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }

        .card {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
            position: relative;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
        }
    </style>
</head>

<body>

<div class="card">
    <span class="close">X</span>

    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>
</div>

</body>
</html>
