<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 450px;
            margin: 50px auto;
        }

        fieldset {
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid blue;
        }

        legend {
            font-weight: bold;
            padding: 5px 10px;
        }

        input, textarea {
            margin: 8px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<form>

    <fieldset>
        <legend>Personal Information</legend>

        Name:
        <input type="text"><br>

        Email:
        <input type="email">
    </fieldset>

    <fieldset>
        <legend>Your Opinion</legend>

        Do you like this website?<br>

        <input type="radio" name="opinion"> Yes
        <input type="radio" name="opinion"> No

        <br><br>

        Comments:<br>
        <textarea rows="4"></textarea>
    </fieldset>

    <button type="submit">Submit Survey</button>

</form>

</body>
</html>
