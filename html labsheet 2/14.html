<!DOCTYPE html>
<html>
<head>
<title>Range Slider</title>
</head>

<body>

<h2>Product Quantity</h2>

<form>
    <label>Quantity:</label>

    <input type="range" min="1" max="100" value="50"
           oninput="num.value=this.value">

    <output id="num">50</output> units

    <br><br>

    <label>Number:</label>
    <input type="number" min="1" max="100">
</form>

</body>
</html>
