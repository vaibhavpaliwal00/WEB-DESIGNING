<!DOCTYPE html>
<html>
<head>
    <title>Modern Student Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            height: 20%;
            padding: 20px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .main {
            display: flex;
            flex: 1;
        }

        .navigation {
            width: 25%;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .navigation a {
            display: block;
            margin-bottom: 15px;
            text-decoration: none;
        }
