<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            height: 100px;
            background: lightblue;
            text-align: center;
            padding: 20px;
        }

        .main {
            display: flex;
            height: 400px;
        }

        .nav {
            width: 25%;
            background: lightgray;
            padding: 20px;
        }

        .content {
            width: 75%;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Portal</h1>
    </div>

    <div class="main">

        <div class="nav">
            <h3>Navigation</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </div>

        <div class="content">
            <h2>Welcome Student</h2>
            <p>This is the content area.</p>
        </div>

    </div>

</body>
</html>

.main {
    display: flex;
}
