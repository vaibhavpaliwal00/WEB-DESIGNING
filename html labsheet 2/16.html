<!DOCTYPE html>
<html>
<head>
<title>Employee Evaluation</title>

<style>
.form {
    width: 500px;
    padding: 20px;
    border: 1px solid gray;
}

.field {
    margin-bottom: 15px;
}

label {
    width: 150px;
    float: left;
}

input, select {
    padding: 7px;
}

.clear {
    clear: both;
}

button {
    padding: 10px 20px;
}
</style>
</head>

<body>

<div class="form">

<h2>Employee Evaluation</h2>

<div class="field">
    <label>Employee Name:</label>
    <input type="text">
</div>

<div class="field">
    <label>Performance:</label>
    <select>
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
    </select>
</div>

<div class="field">
    <label>Comments:</label>
    <input type="text">
</div>

<div class="clear"></div>

<button>Submit</button>

</div>

</body>
</html>
