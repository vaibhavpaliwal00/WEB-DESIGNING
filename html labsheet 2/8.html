<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            width: 400px;
            margin: 80px auto;
            padding: 25px;
            border: 1px solid gray;
        }

        input {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            transition: 0.3s;
        }

        button:hover {
            background-color: green;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Upload File</h2>

    <form>
        <input type="file">
        <br>

        <button type="submit">Upload</button>
    </form>

</div>

</body>
</html>
